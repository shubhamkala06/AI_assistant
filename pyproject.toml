[project]
name = "final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
